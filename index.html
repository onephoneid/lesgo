<style>
.lokmap{height:260px;margin:12px 0;border:1px solid var(--line);border-radius:12px;z-index:0}.lokpin{width:20px!important;height:20px!important;background:var(--or);border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0008}.lokresults button{display:block;width:100%;text-align:left;white-space:normal;margin-top:6px}.lokstatus{margin:6px 0;font-size:12px}.leaflet-container{font-family:inherit}
:root{--bg:#f4f7fd;--card:#fff;--ink:#0f2350;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#e6eeff;--navy:#0f2a6b;--or:#f97316;--or2:#fff1e6;--yel:#fbbf24;--ok:#059669;--okb:#d1fae5;--warn:#b45309;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo img{height:46px;display:block}
.logo small{font-family:Fredoka,sans-serif;font-weight:600;color:var(--navy);font-size:14px;border-left:2px solid var(--line);padding-left:10px}
h2,h3,.stat b,.score{font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-weight:700}
h2{color:var(--navy)}
header{border-top:4px solid var(--or)}
.sp{flex:1}
.who{font-weight:600;font-size:13px;background:var(--pri2);color:var(--pri);padding:6px 12px;border-radius:99px}
select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:10px 0 4px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.or{background:var(--or)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gh{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.wa{background:#22c55e}.btn.ai{background:linear-gradient(90deg,#7c3aed,#4f46e5)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
nav button{font:inherit;font-weight:600;background:none;border:0;padding:10px 11px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--or)}
main{max-width:1150px;margin:0 auto;padding:20px}
h2{margin:0 0 4px;font-size:22px}
.sub{color:var(--mut);margin:0 0 18px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{font-size:22px;display:block;margin-top:4px}
.stat small{color:var(--mut);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);margin:2px 4px 2px 0}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.gr{background:#f3f4f6;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.mut{color:var(--mut)}
.tw{max-width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:700}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.empty{text-align:center;color:var(--mut);padding:24px}
.rep{border-left:4px solid var(--pri);padding-left:12px}
.score{font-size:28px;font-weight:800}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ok)}
.att{display:flex;gap:6px;flex-wrap:wrap}
.att label{margin:0;display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);font-size:12px;border:1px solid var(--line);padding:5px 8px;border-radius:8px;cursor:pointer}
.att input{width:auto}
.stars label{font-size:26px;cursor:pointer;margin:0;color:#d1d5db}
.stars input{display:none}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#f59e0b}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:100%;overflow:auto;overscroll-behavior:contain;padding:20px}
body.modal-open{overflow:hidden}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:60;max-width:90vw;text-align:center}
.bell{position:relative;cursor:pointer;font-size:20px;background:none;border:0}
.bell em{position:absolute;top:-4px;right:-6px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:700}
.wabox{background:#f0fdf4;border:1px dashed #86efac;border-radius:10px;padding:10px;white-space:pre-wrap;font-size:13px}
.aibox{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:12px;padding:12px;white-space:pre-wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.day.today{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.day h4{margin:0 0 6px;font-size:13px}
.slot{background:var(--pri2);border-radius:8px;padding:6px;margin-bottom:6px;font-size:12px}
.slot.u{background:var(--or2)}
.banner{background:var(--warnb);color:var(--warn);padding:8px 20px;font-weight:600;font-size:13px}
.hero{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.pick{cursor:pointer;text-align:center;padding:28px 16px;border:2px solid var(--line);border-radius:16px;background:#fff}
.pick:hover{border-color:var(--or);transform:translateY(-2px)}
.pick{transition:.15s}
.heroLogo{width:min(380px,80vw);display:block;margin:0 auto 6px}
.pick div{font-size:44px}

/* ===== App shell (gaya super-app) ===== */
:root{--r:18px;--sh:0 4px 18px rgba(15,42,107,.07);--bg:#f3f6fc}
header{display:none}
.card,.stat{border:0!important;box-shadow:var(--sh);border-radius:var(--r)}
.card{padding:18px}
#layout{display:flex;min-height:100vh}
#side{width:248px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 12px 24px;flex:none}
#side .lg{display:block;width:160px;margin:2px auto 14px;cursor:pointer}
#side .cab{text-align:center;font-family:Fredoka;font-weight:600;color:var(--navy);margin:-8px 0 12px;font-size:13px}
#side button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:14px;font:inherit;font-weight:600;color:#475569;cursor:pointer;text-align:left;margin-bottom:2px;position:relative}
#side button .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
#side button:hover{background:#f6f8fc}
#side button.on{background:var(--pri2);color:var(--navy)}
#side button.on:before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--or)}
.nb{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 7px}
#wrap{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,246,252,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 28px}
.topbar .pt{font-family:Fredoka;font-weight:600;font-size:15px;color:var(--mut)}
.topbar select{max-width:260px;border-radius:99px;background:#fff}
main{max-width:1120px;padding:6px 28px 48px}
#bottom{display:none}
.hero2{background:linear-gradient(135deg,#0f2a6b 0%,#1d4ed8 62%,#3b82f6 100%);color:#fff;border-radius:26px;padding:24px 24px 20px;position:relative;overflow:hidden;margin-bottom:18px}
.hero2:before,.hero2:after{content:'';position:absolute;border-radius:50%}
.hero2:before{width:280px;height:280px;right:-70px;top:-110px;background:rgba(255,255,255,.08)}
.hero2:after{width:150px;height:150px;right:140px;bottom:-80px;background:rgba(251,191,36,.28)}
.hero2 .in{position:relative;z-index:1}
.hero2 h2{color:#fff;font-size:26px;margin:2px 0}
.hero2 p{opacity:.88;margin:0 0 16px}
.hero2 .hi{font-size:13px;font-weight:600;opacity:.8}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;position:relative;z-index:1}
.hstats :is(div,button){background:rgba(255,255,255,.14);border-radius:16px;padding:10px 14px;min-width:0}
.hstats button{border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.hstats button:hover{background:rgba(255,255,255,.22)}
.hstats button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hstats small{opacity:.85;font-size:12px;font-weight:600}
.hstats b{display:block;font-family:Fredoka;font-size:21px}
.menuGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-bottom:22px}
.mtile{background:#fff;border-radius:18px;padding:14px 6px 12px;text-align:center;cursor:pointer;box-shadow:var(--sh);border:0;font:inherit;font-size:12px;font-weight:700;color:var(--ink);position:relative;transition:.15s}
.mtile:hover{transform:translateY(-3px)}
.mtile i{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;margin:0 auto 8px;font-size:23px;font-style:normal}
.mtile .nb{position:absolute;top:8px;right:10px}
.who{font-family:inherit;border:1px solid #dce3fa;cursor:pointer;min-height:40px}
.dashboard-home{background:#f6f5fc}
.dashboard-home .hero2{background:linear-gradient(115deg,#242060,#433bb8);padding:clamp(16px,3.5vw,32px);margin-bottom:22px}
.dashboard-home .hero2::after{background:#a499f746}
.dashboard-home .hero2 h2{font-size:clamp(25px,4vw,37px);overflow-wrap:anywhere}
.dashboard-home .hstats{grid-template-columns:repeat(auto-fit,minmax(min(142px,100%),1fr))}
.dashboard-home .hstats b{overflow-wrap:anywhere}
.dashboard-shortcuts .sech{gap:10px;margin-bottom:12px}
.dashboard-shortcuts h3{font-size:20px}
.dashboard-shortcuts .btn{min-height:40px}
.dashboard-shortcuts .menuGrid,.menuGrid.menuGrid-all{grid-template-columns:repeat(auto-fit,minmax(min(154px,100%),1fr))}
.dashboard-shortcuts .mtile,.menuGrid-all .mtile{display:flex;align-items:center;gap:9px;border:1px solid #e3e0f3;box-shadow:none;text-align:left;padding:9px;border-radius:13px;min-height:60px;overflow-wrap:anywhere}
.dashboard-shortcuts .mtile:hover,.menuGrid-all .mtile:hover{transform:none;background:#f6f4ff}
.dashboard-shortcuts .mtile i,.menuGrid-all .mtile i{width:42px;height:42px;flex:none;margin:0;border-radius:10px}
.mtile img{object-fit:contain}
.dashboard-shortcuts .mtile .nb,.menuGrid-all .mtile .nb{position:static;flex:none;padding:2px 5px;margin-left:auto}
.mtile[aria-current="page"]{background:#edeaff;color:#2c267f}
.dashboard-shortcuts .mtile:focus-visible,.menuGrid-all .mtile:focus-visible,.who:focus-visible,#bottom button:focus-visible{outline:2px solid #4038b3;outline-offset:2px}
.menuGrid.menuGrid-all{margin:14px 0 0}
.menu-account{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:22px;padding-bottom:6px;scrollbar-width:thin}
.bn{flex:0 0 min(400px,86%);scroll-snap-align:start;border-radius:22px;padding:18px 110px 18px 18px;color:#fff;position:relative;overflow:hidden;cursor:pointer;min-height:124px}
.bn h4{font-family:Fredoka;font-size:19px;margin:0 0 4px}
.bn p{margin:0 0 10px;opacity:.92;font-size:13px}
.bn .go{display:inline-block;background:#fff;color:var(--navy);font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px}
.bn .emo{position:absolute;right:14px;bottom:2px;font-size:64px}
.bn:after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);right:-40px;top:-50px}
.b1{background:linear-gradient(120deg,#f97316,#fb923c)}.b2{background:linear-gradient(120deg,#1d4ed8,#3b82f6)}.b3{background:linear-gradient(120deg,#059669,#10b981)}.b4{background:linear-gradient(120deg,#7c3aed,#a78bfa)}
.sech{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
.sech h3{margin:0}.sech a{color:var(--pri);font-weight:700;cursor:pointer;font-size:13px}
.gcard{position:relative;overflow:hidden}
.gcard:before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--pri),var(--or))}
.gcard .av{width:56px;height:56px;border-radius:18px;font-size:18px}
.price{font-family:Fredoka;font-size:20px;color:var(--or)}
/* Public site and sign-in */
body.landing{--landing-bg:#fbfaf5;--landing-ink:#192047;--landing-muted:#515875;--landing-primary:#3933b7;--landing-line:#e2e0ed;background:var(--landing-bg)}
.landing #side,.landing .topbar .pt{display:none}
.brand-link{display:none;padding:0;border:0;background:none;cursor:pointer}
.brand-link img{display:block;width:74px;height:auto}
.public-nav{display:flex;gap:26px;margin-inline:auto;padding:0}
.public-nav[hidden]{display:none}
.public-nav a{color:var(--landing-muted);text-decoration:none;font-weight:700;padding:10px 0;white-space:nowrap}
.public-nav a:hover{color:var(--landing-primary);text-decoration:underline;text-underline-offset:4px}
.landing .brand-link{display:block}
.landing .topbar{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;min-height:75px;padding:10px max(20px,calc((100% - 1168px)/2));background:var(--landing-bg);border-bottom:1px solid var(--landing-line)}
.landing .topbar .sp{display:none}
.landing #whoBox{grid-column:3;justify-self:end}
.landing main{max-width:1216px;padding:0 24px 24px}
.public-actions{display:flex;gap:8px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:14px}
.landing .public-actions .btn,.landing .hero-actions .btn,.landing .login-submit{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;border-radius:11px;white-space:normal}
.landing .public-actions .btn:first-child{border-color:var(--landing-line);color:var(--landing-ink)}
.landing .public-actions .btn:last-child,.landing .hero-actions .btn:first-child,.landing .login-submit{background:var(--landing-primary);color:#fff}
.landing .public-actions .btn:hover,.landing .hero-actions .btn:hover,.landing .login-submit:hover{filter:brightness(.92)}
.landing :is(button,a):focus-visible{outline:3px solid var(--landing-primary);outline-offset:3px}
.lh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.07fr);gap:clamp(26px,5vw,76px);align-items:center;padding:clamp(34px,6vw,88px) 0 50px}
.hero-category{display:flex;align-items:center;gap:9px;color:#42391f;font-size:13px;font-weight:800;margin:0 0 18px}
.hero-category::before{content:'';width:21px;height:3px;border-radius:99px;background:#d6a629}
.lh h1{font-family:Fredoka,system-ui,sans-serif;font-size:clamp(52px,6.1vw,88px);font-weight:600;letter-spacing:-.044em;line-height:.98;margin:0 0 20px;color:var(--landing-ink)}
.lh h1 span{display:block;color:var(--landing-primary)}
.lh .lead{font-size:clamp(15px,1.35vw,17px);line-height:1.72;color:var(--landing-muted);max-width:43ch;margin:0 0 26px}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px}
.hero-actions .btn{min-height:50px}
.hero-actions .btn:nth-child(2){color:var(--landing-primary);background:#eeecfb}
.public-section{scroll-margin-top:95px}
.lsec{margin:clamp(38px,5.5vw,72px) 0 19px}
.lsec h2,.login h1{font-family:Fredoka,system-ui,sans-serif;font-size:clamp(27px,3.7vw,43px);font-weight:600;letter-spacing:-.025em;color:var(--landing-ink)}
.lsec p{color:var(--landing-muted);margin:5px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.strip{background:#eeecfb;border-radius:20px;color:var(--landing-ink);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr));gap:10px;padding:19px;margin:26px 0;text-align:center}
.strip b{display:block;font-family:Fredoka,system-ui,sans-serif;font-size:31px;color:var(--landing-primary)}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;border-top:1px solid var(--landing-line);padding:18px 0}
.testi{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}.testi .card{flex:0 0 min(320px,85%)}
.login{display:grid;place-items:start center;padding:28px 0 38px}
.login-shell{width:min(820px,100%)}
.login-back,.login-text-button{padding:7px 0;border:0;background:none;font:inherit;font-weight:700;color:var(--landing-primary);cursor:pointer;text-align:left}
.login-back{min-height:42px;margin-bottom:9px}
.login-panel{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1fr);background:#fff;border:1px solid var(--landing-line);border-radius:24px;overflow:hidden}
.login-panel .login-picture{width:100%;height:100%;object-fit:cover;object-position:52% center;background:#cfccf0;min-height:100%}
.lcard{padding:clamp(20px,4vw,36px);min-width:0}
.login h1{font-size:clamp(29px,4vw,39px);line-height:1;margin:0 0 8px}
.login .sub{margin:0 0 16px;color:var(--landing-muted)}
.login .seg{margin-bottom:15px;background:#efedf8}

<div id="layout">
 <aside id="side"></aside>
 <div id="wrap">
  <div class="topbar"><button class="brand-link" type="button" aria-label="Beranda LesGo" onclick="if(role()==='new')landView='home';go('beranda')"><img src="logo.png" alt=""></button>
   <nav class="public-nav" id="publicNav" aria-label="Jelajahi LesGo" hidden><a href="/?jelajah=bacaan">Blog &amp; Materi</a><a href="/?jelajah=guru">Profil Guru</a><a href="#fitur">Fitur</a><a href="#cara-kerja">Cara kerja</a><a href="#perkiraan-pendapatan">Untuk Guru</a></nav>
   <span class="pt" id="ptitle"></span><div class="sp"></div>
   <button class="bell" id="bell" onclick="go('notif')" title="Notifikasi">🔔<em id="bellN2" style="display:none"></em></button><div id="whoBox"></div></div>
  <div id="banner"></div>
  <main id="app"><div class="empty">Memuat data…</div></main>
 </div>
</div>
<nav id="bottom" aria-label="Navigasi utama"></nav>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
// ================== STATE & DATA LAYER ==================
const COLS=['dokumen','potongan','cabang','guru','ortu','murid','kelas','materi','pr','kumpul','absensi','laporan','spp','lowongan','lamaran','req','notif','ulasan','config'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const COLORS=['#4f46e5','#059669','#d97706','#db2777','#0891b2','#7c3aed','#ea580c'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY=ymd(new Date()),BLN=TODAY.slice(0,7),DOW=new Date().getDay();
let S={};COLS.forEach(c=>S[c]=[]);
let DB=null,USER=null,SAMPLE=null,myUid=null,isOwner=false,MODE='loading',readOnly=false,stale=false;
let me='a:admin',view='beranda',pend=false;
try{me=localStorage.getItem('lp_me')||me}catch(e){}

function loadLocal(){try{const d=JSON.parse(localStorage.getItem('lp_data_v2'));if(d)COLS.forEach(c=>S[c]=d[c]||[])}catch(e){}}
function saveLocal(){try{localStorage.setItem('lp_data_v2',JSON.stringify(S))}catch(e){}}
function dbErr(e){if(e&&e.code==='invalid_argument'){readOnly=true;toast('Kamu hanya punya akses lihat. Minta pemilik membagikan sebagai Contributor.')}else if(e&&e.code==='quota_exceeded')toast('Penyimpanan penuh — hapus data lama di menu Admin.');else toast('Gagal menyimpan, coba lagi.');render()}
const clean=o=>JSON.parse(JSON.stringify(o));
async function put(c,o){let saved=o;
 if(MODE==='api'){const r=await api('put',{col:c,doc:clean(o)});if(!r.ok){await refreshAll();throw new Error(r.error||'Gagal menyimpan data')}saved=r.doc||o}
 else if(DB){try{await DB.collection(c).doc(o.id).set(clean(o))}catch(e){dbErr(e);throw e}}
 const i=S[c].findIndex(x=>x.id===saved.id);if(i>=0)S[c][i]=saved;else S[c].push(saved);if(MODE!=='api'&&!DB)saveLocal();if(MODE==='api'&&c==='dokumen')await refreshAll();return saved}
async function del(c,id){if(MODE==='api'){const r=await api('del',{col:c,id});if(!r.ok){await refreshAll();throw new Error(r.error||'Gagal menghapus data')}}else if(DB){try{await DB.collection(c).doc(id).delete()}catch(e){dbErr(e);throw e}}S[c]=S[c].filter(x=>x.id!==id);if(MODE!=='api'&&!DB)saveLocal()}
window.addEventListener('unhandledrejection',e=>{e.preventDefault();toast(e.reason?.message||'Proses belum berhasil. Coba lagi.')});
async function notify(to,text){if(!to)return;await put('notif',{id:uid('n'),to,text,t:TODAY,ts:Date.now(),read:false})}

async function init(){
 const timer=setTimeout(()=>{if(MODE==='loading'){if(DB){MODE='shared';stale=true}else{MODE=location.protocol==='file:'?'local':'offline';if(MODE==='local')loadLocal()}render()}},10000);
 try{if(window.claude&&claude.use){[DB,USER,SAMPLE]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')])}}catch(e){}
 if(!DB){if(await tryApi()){clearTimeout(timer);return}clearTimeout(timer);MODE=location.protocol==='file:'?'local':'offline';if(MODE==='local')loadLocal();return render()}
 try{myUid=await USER?.id()}catch(e){}
 try{isOwner=!!(await USER?.isOwner())}catch(e){}
 try{const w=await USER?.can('data.write');if(w===false)readOnly=true}catch(e){}
 const got=new Set();
 COLS.forEach(c=>{DB.collection(c).onSnapshot(snap=>{
   S[c]=snap.docs.map(d=>({...clean(d.data()),id:d.id}));got.add(c);
   if(!snap.metadata.fromCache&&stale&&got.size===COLS.length)stale=false;
   if(MODE==='loading'&&got.size===COLS.length){MODE='shared';clearTimeout(timer);render()}else if(MODE!=='loading')softRender();
  },err=>{got.add(c);if(MODE==='loading'&&got.size===COLS.length){MODE='shared';clearTimeout(timer);render()}})});
}

function softRender(){const a=document.activeElement;const typing=a&&a.closest&&a.closest('#app,#mbox')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
 if($('modal').style.display==='flex'||typing){pend=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend){pend=false;softRender()}},500));


// ---------- Mode server (Vercel API) ----------
let previewTeacher='';
let TOKEN=null,apiVer=-1,adminSet=true;try{TOKEN=localStorage.getItem('lp_tok')}catch(e){}
const tokP=()=>{try{return JSON.parse(atob(TOKEN.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return null}};
function setTok(t){if(t!==TOKEN){transferQueue=[];publicationFeed=[];publicationFilter='';avatarCache.clear();avatarRequests.clear();avatarObserver?.disconnect()}TOKEN=t;if(!t){SERVER_ME=null;previewTeacher=''}try{t?localStorage.setItem('lp_tok',t):localStorage.removeItem('lp_tok')}catch(e){}}
async function api(op,body={}){if(previewTeacher&&!['all','ver'].includes(op))return{ok:false,error:'Pratinjau hanya untuk melihat. Kembali ke Admin untuk mengubah data.'};try{const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:JSON.stringify({op,...body})});const j=await r.json().catch(()=>({ok:false}));return{status:r.status,...j}}catch(e){return{ok:false,error:'Koneksi gagal, coba lagi'}}}
let SERVER_ME=null,SITE_STATS=null,refreshId=0;
function applyAll(j){SERVER_ME=j.me||null;SITE_STATS=j.stats||null;COLS.forEach(c=>S[c]=(j.data&&j.data[c])||[]);apiVer=j.ver;adminSet=j.adminSet}
async function refreshAll(){
 const token=TOKEN,requestId=++refreshId;
 try{
  const r=await fetch('/api/db?op=all',{headers:token?{Authorization:'Bearer '+token}:{},signal:AbortSignal.timeout(10000)});
  const j=await r.json();
  if(!r.ok||!j.ok||token!==TOKEN||requestId!==refreshId)return false;
  if(token&&!j.me)setTok(null);
  applyAll(j);
  return true;
 }catch{return false}
}
async function finishLogin(token,expectedRole,message,keepForm=false){
 if(!token){toast('Sesi belum diterima. Coba masuk lagi.');return false}
 setTok(token);
 const updated=await refreshAll();
 if(!updated||SERVER_ME?.r!==expectedRole){
  if(TOKEN===token)setTok(null);
  if(!keepForm)toast('Sesi belum bisa dimuat. Coba masuk lagi.');
  return false;
 }
 closeM();
 view='beranda';landView='home';
 toast(message);render();
 return true;
}
async function submitOnce(button,task){
 if(!button||button.disabled)return;
 button.disabled=true;
 try{return await task()}catch(e){toast(e.message||'Proses belum berhasil. Coba lagi.')}
 finally{button.disabled=false}
}
async function tryApi(){if(location.protocol==='file:')return false;try{const r=await fetch('/api/db?op=all',{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}});if(!r.ok)return false;const j=await r.json();if(!j.ok)return false;
 if(TOKEN&&!j.me)setTok(null);applyAll(j);MODE='api';
 setInterval(async()=>{if(document.hidden||(TOKEN&&!SERVER_ME))return;try{const v=await (await fetch('/api/db?op=ver')).json();if(TOKEN&&!SERVER_ME)return;if(v.ok&&(v.ver!==apiVer||(TOKEN&&tokP()?.exp<Date.now()))){if(await refreshAll())softRender()}}catch(e){}},30000);
 render();return true}catch(e){return false}}
function adminLoginView(){openM(`<h3>🛡️ Masuk sebagai Admin</h3><p class="mut">Khusus pemilik aplikasi.</p><form onsubmit="event.preventDefault();submitOnce($('ad_submit'),adminGo)"><label for="ad_u">Username</label><input id="ad_u" autocomplete="username" required><label for="ad_p">Password</label><input id="ad_p" type="password" autocomplete="current-password" required><p id="ad_status" class="mut" role="status"></p><div class="row" style="margin-top:14px"><button id="ad_submit" class="btn" type="submit">Masuk</button><button class="btn gh" type="button" onclick="closeM()">Batal</button></div></form>`)}
async function adminGo(){const username=$('ad_u').value.trim(),password=$('ad_p').value;if(!username||!password)return toast('Isi username dan password');
 const status=$('ad_status');
 status.textContent='Memeriksa login…';
 const r=await api('adminLogin',{username,password});
 if(!status.isConnected||$('modal').style.display!=='flex')return;
 if(!r.ok){status.textContent=r.error||'Login admin gagal.';return}
 if(!await finishLogin(r.token,'a','Selamat datang, Admin!',true)){
  status.textContent='Sesi admin belum bisa dimuat. Coba masuk lagi.';
 }
}

// ================== HELPERS ==================
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fdate=d=>{if(!d)return'-';const[y,m,dd]=d.split('-');return dd?`${+dd} ${BULAN[+m-1]} ${y}`:`${BULAN[+m-1]} ${y}`};
const G=id=>S.guru.find(x=>x.id===id),O=id=>S.ortu.find(x=>x.id===id),M=id=>S.murid.find(x=>x.id===id),K=id=>S.kelas.find(x=>x.id===id);
const N=o=>o?o.nama:'(terhapus)';
const CFG=()=>S.config.find(x=>x.id==='main')||{};
const FEE=()=>{const v=CFG().feeNominal;return v==null?10000:+v};
const FEEMODE=()=>CFG().feeMode||'sekali';
const feeLabel=()=>FEEMODE()==='bulanan'?`${rp(FEE())} per murid per bulan`:`${rp(FEE())} sekali per murid baru`;
async function catatPotongan(gid,mid,kid,ket){if(!FEE())return;if(FEEMODE()!=='sekali')return;const id=`${gid}_${mid}`;if(S.potongan.find(x=>x.id===id))return;
 await put('potongan',{id,guruId:gid,muridId:mid,kelasId:kid,nominal:FEE(),jenis:'Murid baru',ket,tanggal:TODAY,status:'Belum'});
 await notify(gid,`💰 Biaya platform ${rp(FEE())} tercatat untuk murid baru ${N(M(mid))}. Bayar di menu Penghasilan.`)}
const role=()=>me.split(':')[0],myId=()=>me.split(':')[1];
const av=(nama,i=0)=>`<div class="av" style="background:${COLORS[((nama||'?').charCodeAt(0)+i)%COLORS.length]}">${esc((nama||'?').replace(/^(Pak|Bu|Kak|Ibu|Bapak)\s/,'').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`;
const avatarCache=new Map(),avatarRequests=new Set();
let avatarObserver;
const avatarKey=(scope,id)=>scope+':'+id;
function mediaAvatar(person,scope){
 return `<span class="media-avatar" data-avatar-scope="${scope}" data-avatar-id="${esc(person.id)}">${av(person.nama)}</span>`;
}
async function profileMedia(op,body={},token=TOKEN){
 const response=await fetch('/api/profile-media',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({op,...body})});
 const result=await response.json().catch(()=>null);
 if(!response.ok||!result?.ok)throw new Error(result?.error||'Media profil belum bisa dimuat. Coba lagi.');
 return result;
}
function showAvatar(node,url){
 if(!url)return;
 if(node.firstElementChild?.src===url)return;
 const img=document.createElement('img');
 img.alt='';img.referrerPolicy='no-referrer';
 img.onload=()=>{if(node.isConnected)node.replaceChildren(img)};
 img.src=url;
}
function mountProfileAvatars(){
 if(MODE!=='api'||!TOKEN)return;
 if(!avatarObserver)avatarObserver=new IntersectionObserver(entries=>{
  const batch=[];
  for(const {target,isIntersecting} of entries){
   if(!isIntersecting)continue;
   avatarObserver.unobserve(target);
   const {avatarScope:scope,avatarId:id}=target.dataset;
   const key=avatarKey(scope,id),stored=avatarCache.get(key);
   if(stored?.until>Date.now()){showAvatar(target,stored.url);continue}
   if(!avatarRequests.has(key)){
    avatarRequests.add(key);batch.push({scope,id,key});
   }
  }
  for(let i=0;i<batch.length;i+=20)void loadProfileAvatars(batch.slice(i,i+20));
 },{rootMargin:'100px'});
 document.querySelectorAll('[data-avatar-id]').forEach(node=>{
  if(node.closest('#modal')&&$('modal').style.display!=='flex')return;
  const cached=avatarCache.get(avatarKey(node.dataset.avatarScope,node.dataset.avatarId));
  if(cached?.until>Date.now())showAvatar(node,cached.url);
  else avatarObserver.observe(node);
 });
}
async function loadProfileAvatars(batch){
 const token=TOKEN;
 try{
  const {urls}=await profileMedia('avatars',{items:batch.map(({scope,id})=>({scope,id}))},token);
  if(token!==TOKEN)return;
  batch.forEach(({key},i)=>{if(!(avatarCache.get(key)?.until>Date.now()))avatarCache.set(key,{url:urls[i],until:Date.now()+(urls[i]?50*60*1000:30000)})});
  mountProfileAvatars();
 }catch{}finally{if(token===TOKEN)batch.forEach(({key})=>avatarRequests.delete(key))}
}
function openPhoto(scope,id){
 if(!TOKEN||previewTeacher)return;
 openM(`<h3>Foto profil</h3><p class="mut">${scope==='guru'?'Foto tampil di profil guru.':'Foto terlihat di akun keluarga.'}</p>
  <label for="media-file">Pilih foto</label><input id="media-file" type="file" accept="image/jpeg,image/png,image/webp">
  <p id="media-status" class="mut" role="status"></p><div id="media-current"></div>
  <div class="row media-actions"><button id="media-save" class="btn or" type="button" disabled>Simpan foto</button><button class="btn gh" type="button" onclick="closeM()">Tutup</button></div>`);
 const save=$('media-save'),status=$('media-status');
 save.addEventListener('click',()=>submitOnce(save,async()=>{
  const file=$('media-file').files[0];
  if(!file){status.textContent='Pilih foto dulu.';return}
  try{
   status.textContent='Menyiapkan foto…';
   const photo=await resizeAvatar(file);
   const record=await uploadProfileMedia(scope,id,photo,{},status);
   updatePhoto(scope,id,status,'Foto profil diperbarui',record?.url);
  }catch(error){status.textContent=error.message}
 }));
 void loadEditableMedia(scope,id);
}
async function resizeAvatar(file){
 if(file.size>10*1024*1024)throw new Error('Pilih foto hingga 10 MB.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Pilih foto JPG, PNG, atau WebP.');
 const bitmap=await createImageBitmap(file);
 try{
  const side=Math.min(bitmap.width,bitmap.height),size=Math.min(side,384);
  const canvas=document.createElement('canvas');canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
  ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,size,size);
  const photo=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));
  if(!photo)throw new Error('Foto tidak bisa diproses.');
  return photo;
 }finally{bitmap.close()}
}
function updatePhoto(scope,id,status,message,url=''){
 avatarCache.set(avatarKey(scope,id),{url,until:Date.now()+(url?50*60*1000:30000)});
 if(status.isConnected&&$('modal').style.display==='flex')closeM();
 softRender();toast(message);
}
async function uploadMediaFile(prepared,file){
 const result=await fetch(prepared.uploadUrl,{method:'PUT',body:file,referrerPolicy:'no-referrer',headers:{
   'Content-Type':file.type,'x-content-type':file.type,'x-api-version':'12','x-vercel-blob-access':'private',

async function resizePublicationImage(file){
 if(file.size>10*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Pilih gambar JPG, PNG, atau WebP hingga 10 MB.');
 const image=await createImageBitmap(file);
 try{
  const scale=Math.min(1,960/Math.max(image.width,image.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  for(const quality of [.82,.65,.49,.35]){
   const jpg=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
   if(jpg&&jpg.size<=256*1024)return jpg;
  }
  throw new Error('Gambar terlalu besar setelah diproses. Pilih gambar yang lebih kecil.');
 }finally{image.close()}
}

async function openEmailAuth(mode) {
 const linking = mode === 'link', selectedRole = linking ? role() : loginRole;
 openM(`<h3>${linking?'Tautkan email':'Masuk lewat email'}</h3>
 <p class="mut">${linking?'Verifikasi email untuk menggunakannya saat masuk berikutnya.':'Gunakan email yang sudah ditautkan ke akun LesGo. Pertama kali, masuk dengan No. HP dan PIN, lalu tautkan email melalui menu akun.'}</p>
 <form id="email_form"><label for="email_address">Alamat email</label><input id="email_address" type="email" autocomplete="email" maxlength="254" required>
 <div id="email_code_box" hidden><label for="email_code">Kode 6 angka dari email</label><input id="email_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
 <p id="email_status" class="mut" role="status">Memeriksa layanan pengiriman email…</p>
 <div class="row"><button id="email_submit" type="submit" class="btn or" disabled>Kirim kode</button><button id="email_resend" type="button" class="btn sec" hidden>Kirim ulang</button><button type="button" class="btn gh" onclick="closeM()">Tutup</button></div></form>`);
 const form = $('email_form'), address = $('email_address'), code = $('email_code');
 const submit = $('email_submit'), resend = $('email_resend'), status = $('email_status');
 const isOpen = () => form.isConnected && $('modal').style.display === 'flex';
 let phase = 'send';
 async function request(action) {
  if (submit.disabled) return;
  submit.disabled = resend.disabled = true;
  status.textContent = action === 'send' ? 'Meminta kode…' : 'Memeriksa kode…';
  try {
   const response = await fetch('/api/email-auth', {
    method:'POST', headers:{'Content-Type':'application/json', ...(linking&&TOKEN?{Authorization:'Bearer '+TOKEN}:{})},
    body:JSON.stringify({mode,action,role:selectedRole,email:address.value,code:code.value})
   });
   const result = await response.json();
   if (!isOpen()) return;
   if (!response.ok || !result.ok) throw new Error(result.error || 'Coba lagi sebentar.');
   if (action === 'send') {
    phase = 'verify';
    address.readOnly = true;
    $('email_code_box').hidden = false;
    code.required = true;
    code.value = '';
    code.focus();
    submit.textContent = linking ? 'Verifikasi email' : 'Masuk';
    resend.hidden = false;
    status.textContent = linking ? 'Periksa inbox atau folder spam. Kode berlaku 10 menit.' : 'Jika email sudah tertaut, kode akan dikirim. Periksa inbox atau folder spam.';
   } else {
    if (linking) {closeM();return toast('Email berhasil ditautkan')}
    if (!await finishLogin(result.token,selectedRole,'Berhasil masuk lewat email',true)) {
     phase='send';address.readOnly=false;code.required=false;code.value='';
     $('email_code_box').hidden=true;resend.hidden=true;submit.textContent='Kirim kode';
     status.textContent='Sesi belum bisa dimuat. Minta kode baru untuk mencoba lagi.';
    }
   }
  } catch (error) {
   if (isOpen()) status.textContent = error.message || 'Coba lagi sebentar.';
  } finally {
   submit.disabled = resend.disabled = false;
  }
 }
 form.onsubmit = event => {event.preventDefault();void request(phase)};
 resend.onclick = () => request('send');
 try {
  const response = await fetch('/api/email-auth');
  const result = await response.json();
  if (!isOpen()) return;
  submit.disabled = !result.enabled;
  status.textContent = result.enabled ? '' : 'Pengiriman kode email belum aktif.';
 } catch {
  if (isOpen()) status.textContent = 'Pengiriman kode email sedang tidak tersedia.';
 }
}

let rpM='',rpB=BLN,aiCache={};
function raporView(kids,title){
 if(!kids.length)return`<h2>${title}</h2><div class="card empty">Belum ada murid.</div>`;
 if(!kids.find(k=>k.id===rpM))rpM=kids[0].id;const m=M(rpM);
 const months=[...new Set([BLN,...S.laporan.filter(l=>l.muridId===rpM).map(l=>l.tanggal.slice(0,7))])].sort().reverse();
 if(!months.includes(rpB))rpB=months[0];
 const L=S.laporan.filter(l=>l.muridId===rpM&&l.tanggal.startsWith(rpB)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
 const at=attendance(rpM,{bulan:rpB}),avg=avgNilai(rpM,rpB);
 const prs=S.pr.filter(p=>(p.murid||[]).includes(rpM)&&p.deadline.startsWith(rpB)),done=prs.filter(p=>KP(p.id,rpM).status!=='Belum').length;
 const byMapel={};L.forEach(l=>{const mp=K(l.kelasId)?.mapel||'-';(byMapel[mp]=byMapel[mp]||[]).push(+l.nilai)});
 const key=rpM+rpB;
 return`<h2>${title}</h2><p class="sub">Rangkuman perkembangan satu bulan: nilai, kehadiran, PR, dan kemampuan yang sudah dikuasai.</p>
 <div class="card row"><div style="width:200px"><select onchange="rpM=this.value;render()">${opt(kids.map(k=>[k.id,k.nama]),rpM)}</select></div><div style="width:160px"><select onchange="rpB=this.value;render()">${opt(months.map(b=>[b,fdate(b)]),rpB)}</select></div><div class="sp"></div><button class="btn sm sec" onclick="copyTxt(raporText())">📋 Salin rapor</button></div>
 <div class="grid g4" style="margin-bottom:14px"><div class="stat"><small>Rata-rata nilai</small><b style="color:var(--pri)">${avg||'-'}</b></div><div class="stat"><small>Kehadiran</small><b>${at.p}%</b><small>${at.h}/${at.t} pertemuan</small></div><div class="stat"><small>PR dikerjakan</small><b>${done}/${prs.length}</b></div><div class="stat"><small>Pertemuan dilaporkan</small><b>${L.length}</b></div></div>
 <div class="grid g2"><div class="card"><h3>📈 Grafik nilai harian</h3>${chart(L)}</div><div class="card"><h3>📘 Rata-rata per mata pelajaran</h3>${Object.entries(byMapel).map(([mp,v])=>{const a=Math.round(v.reduce((x,y)=>x+y,0)/v.length);return`<div style="margin-bottom:8px"><div class="row between"><b>${esc(mp)}</b><span>${a}</span></div><div class="bar"><i style="width:${a}%;background:var(--pri)"></i></div></div>`}).join('')||'<p class="mut">Belum ada data.</p>'}</div></div>
 <div class="grid g2"><div class="card"><h3>✅ Sudah dikuasai</h3>${L.filter(l=>l.bisa).map(l=>`<div>• ${esc(l.bisa)} <small class="mut">(${fdate(l.tanggal)})</small></div>`).join('')||'<p class="mut">-</p>'}</div><div class="card"><h3>🎯 Perlu dilatih</h3>${L.filter(l=>l.perlu).map(l=>`<div>• ${esc(l.perlu)} <small class="mut">(${fdate(l.tanggal)})</small></div>`).join('')||'<p class="mut">-</p>'}</div></div>
 ${SAMPLE?`<div class="card"><div class="row between"><h3 style="margin:0">✨ Ringkasan & saran dari AI</h3><button class="btn sm ai" onclick="aiRapor()" ${L.length?'':'disabled'}>${aiCache[key]?'Buat ulang':'Buat ringkasan'}</button></div><div id="aiOut" class="aibox" style="margin-top:10px;${aiCache[key]?'':'display:none'}">${esc(aiCache[key]||'')}</div></div>`:''}`;
}
function chart(L){
 if(!L.length)return'<p class="mut">Belum ada laporan bulan ini.</p>';
 const W=520,H=180,p=30,n=L.length,x=i=>p+(n===1?(W-2*p)/2:i*(W-2*p)/(n-1)),y=v=>H-p-(v/100)*(H-2*p);
 const pts=L.map((l,i)=>`${x(i)},${y(l.nilai)}`).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${[0,50,100].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="4" y="${y(v)+4}" font-size="10" fill="#6b7280">${v}</text>`).join('')}
 <polyline points="${pts}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>${L.map((l,i)=>`<circle cx="${x(i)}" cy="${y(l.nilai)}" r="4" fill="#4f46e5"><title>${fdate(l.tanggal)}: ${l.nilai}</title></circle><text x="${x(i)}" y="${y(l.nilai)-9}" font-size="10" text-anchor="middle" fill="#14213d" font-weight="700">${l.nilai}</text><text x="${x(i)}" y="${H-10}" font-size="9" text-anchor="middle" fill="#6b7280">${+l.tanggal.slice(8)}</text>`).join('')}</svg>`;
}

let checkinCamera=null, checkinLoop=0, checkinClock=0, checkinPoll=0, checkinDecoder;
function loadCheckinDecoder(){
 if(!checkinDecoder)checkinDecoder=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='/assets/jsqr.js';
  script.onload=()=>typeof window.jsQR==='function'?resolve(window.jsQR):reject(new Error('QR decoder unavailable'));
  script.onerror=()=>reject(new Error('QR decoder unavailable'));
  document.head.append(script);
 }).catch(error=>{checkinDecoder=null;throw error});
 return checkinDecoder;
}
const checkinTime=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'});
function stopCheckinCamera(){
 cancelAnimationFrame(checkinLoop);checkinLoop=0;
 checkinCamera?.getTracks().forEach(track=>track.stop());
 checkinCamera=null;
 const video=$('checkin-video');
 if(video){video.srcObject=null;video.hidden=true}
}
function stopCheckinModal(){
 stopCheckinCamera();
 clearInterval(checkinClock);clearInterval(checkinPoll);
}
window.addEventListener('pagehide',stopCheckinModal);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCheckinCamera()});

function openTeacherCheckin(){
 const select=$('checkin-class');
 if(!select?.value)return toast('Pilih kelas privat tatap muka.');
 const classId=select.value;

 openM(`<h3>QR Kehadiran Guru</h3><p class="mut">${esc(k?.nama||'Kelas privat')}</p>
 <p id="checkin-status" role="status">Menyiapkan QR…</p><div id="checkin-display"></div>
 <div class="row media-actions"><button id="checkin-renew" class="btn sec" type="button" hidden>Perbarui QR</button><button class="btn gh" type="button" onclick="closeM()">Tutup</button></div>`);
 const status=$('checkin-status'),display=$('checkin-display'),renew=$('checkin-renew');
 const current=()=>status.isConnected&&$('modal').style.display==='flex';
 let reset=0, polling=false;
 function showReceipt(receipt){
  clearInterval(checkinClock);clearInterval(checkinPoll);
  status.textContent='Kehadiran guru sudah dicatat.';
  display.innerHTML=checkinSummary(receipt);renew.hidden=true;
  void loadCheckinHistory();
 }
 async function refreshCode(){
  clearInterval(checkinClock);clearInterval(checkinPoll);
  const sequence=++reset;
  status.textContent='Menyiapkan QR…';display.replaceChildren();
  try{
   const data=await checkinApi('issue',{classId});
   if(!current()||sequence!==reset)return;
   if(data.receipt)return showReceipt(data.receipt);
   const img=document.createElement('img');img.className='checkin-qr';img.alt='QR kehadiran guru';img.width=290;img.height=290;img.src=data.qr;
   const fallback=document.createElement('p');fallback.className='checkin-manual';
   fallback.textContent='Kode manual · '+data.code.match(/.{1,4}/g).join(' ');
   display.replaceChildren(img,fallback);renew.hidden=false;
   function tick(){
    if(!current()){clearInterval(checkinClock);clearInterval(checkinPoll);return}
    const left=Math.max(0,Math.ceil((data.expiresAt-Date.now())/1000));
    status.textContent=left?'Minta murid atau wali murid memindai QR. Berlaku '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'.':'QR kedaluwarsa. Tekan Perbarui QR.';
    if(!left){img.hidden=true;fallback.hidden=true;clearInterval(checkinClock);clearInterval(checkinPoll)}
   }
   tick();checkinClock=setInterval(tick,1000);
   checkinPoll=setInterval(async()=>{
    if(polling||!current())return;
    polling=true;
    try{
     const {receipt}=await checkinApi('status',{classId});
     if(receipt&&current()&&sequence===reset)showReceipt(receipt);
    }catch{}finally{polling=false}
   },5000);
  }catch(error){if(current()){status.textContent=error.message;renew.hidden=false}}
 }
 renew.onclick=()=>submitOnce(renew,refreshCode);
 void refreshCode();
}
function openCheckinScanner(){
 if(role()!=='o'||!familyCheckinClasses().length)return;
 openM(`<h3>Pindai QR Guru</h3><p class="mut">Arahkan kamera ke QR yang tampil di perangkat guru. Pemindaian yang berhasil langsung mencatat kehadiran.</p>
 <video class="checkin-camera" id="checkin-video" autoplay muted playsinline hidden></video>
 <button id="checkin-start" class="btn sec" type="button">Aktifkan kamera</button>
 <form id="checkin-manual"><label for="checkin-code">Atau masukkan kode guru</label><div class="row teacher-checkin-select"><input id="checkin-code" style="min-width:0;flex:1" maxlength="26" autocomplete="off" autocapitalize="characters" required><button id="checkin-submit" class="btn or" type="submit">Catat kehadiran</button></div></form>
 <p id="checkin-scan-status" role="status"></p><div id="checkin-receipt"></div>
 <button class="btn gh" type="button" onclick="closeM()">Tutup</button>`);
 const video=$('checkin-video'),status=$('checkin-scan-status'),camera=$('checkin-start'),form=$('checkin-manual'),button=$('checkin-submit');
 const current=()=>video.isConnected&&$('modal').style.display==='flex';
 let busy=false;
 async function submitCode(code){
  if(busy||!current())return;
  busy=true;camera.disabled=true;button.disabled=true;
  stopCheckinCamera();
  status.textContent='Memeriksa kehadiran…';
  try{
   const data=await checkinApi('scan',{code});
   if(!current())return;
   status.textContent=data.already?'Kehadiran guru sebelumnya sudah tercatat.':'Kehadiran guru berhasil dicatat.';
   $('checkin-receipt').innerHTML=checkinSummary(data.receipt);
   form.hidden=true;camera.hidden=true;void loadCheckinHistory();
  }catch(error){if(current())status.textContent=error.message}
  finally{busy=false;button.disabled=false;camera.disabled=false}
 }
 form.onsubmit=event=>{event.preventDefault();void submitCode($('checkin-code').value)};
 camera.onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia){
   status.textContent='Kamera tidak tersedia. Masukkan kode dari perangkat guru.';return;
  }
  if(checkinCamera){stopCheckinCamera();camera.textContent='Aktifkan kamera';return}
  camera.disabled=true;
  try{
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
   if(!current()||document.hidden){stream.getTracks().forEach(t=>t.stop());return}
   checkinCamera=stream;video.srcObject=stream;video.hidden=false;
   const decode=await loadCheckinDecoder();
   if(!current()||video.srcObject!==stream)return;
   await video.play();
   camera.textContent='Matikan kamera';status.textContent='Arahkan kamera ke QR guru.';
   stream.getVideoTracks()[0]?.addEventListener('ended',()=>{if(current()){stopCheckinCamera();camera.textContent='Aktifkan kamera';status.textContent='Kamera berhenti. Aktifkan kembali atau pakai kode guru.'}});
   const frame=document.createElement('canvas'),context=frame.getContext('2d',{willReadFrequently:true});
   if(!context)throw new Error('Canvas unavailable');
   let last=0;
   function scanFrame(now){
    if(!current()||!checkinCamera||video.srcObject!==stream)return;
    if(now-last>=160&&video.readyState>=2&&video.videoWidth){
     last=now;
     const scale=Math.min(1,480/video.videoWidth);
     frame.width=Math.round(video.videoWidth*scale);frame.height=Math.round(video.videoHeight*scale);
     context.drawImage(video,0,0,frame.width,frame.height);
     const pixels=context.getImageData(0,0,frame.width,frame.height);
     const found=decode(pixels.data,pixels.width,pixels.height,{inversionAttempts:'dontInvert'});
     if(found?.data.startsWith('LESGO-HADIR:')){camera.textContent='Aktifkan kamera';void submitCode(found.data);return}
    }
    checkinLoop=requestAnimationFrame(scanFrame);
   }
   checkinLoop=requestAnimationFrame(scanFrame);
  }catch(error){if(current()){stopCheckinCamera();status.textContent=error.name==='NotAllowedError'?'Izin kamera belum diberikan. Masukkan kode dari guru.':'Kamera belum bisa dibuka. Masukkan kode dari guru.'}}
  finally{camera.disabled=false}
 };
}

function terimaReq(id){const r=S.req.find(x=>x.id===id);if(!FEE()||FEEMODE()!=='sekali'||S.potongan.find(x=>x.id===myId()+'_'+r.muridId))return jawabReq(id,1);

 if(!ok){await put('req',{...r,status:'Ditolak'});await notify(r.ortuId,`${N(G(myId()))} belum bisa menerima pengajuan les ${N(m)}.`);toast('Pengajuan ditolak');return render()}
 if(r.tipe==='Umum'&&r.kelasId){const k=K(r.kelasId);if(!k)return toast('Kelas tidak ditemukan');if((k.murid||[]).length>=k.kapasitas)return toast('Kelas sudah penuh');if(!(k.murid||[]).includes(m.id))await put('kelas',{...k,murid:[...(k.murid||[]),m.id]});await catatPotongan(myId(),m.id,k.id,'Gabung '+k.nama)}
 else{const g=G(myId()),nk=uid('k');await catatPotongan(myId(),m.id,nk,'Private class');const mp=r.mapel||g.mapel[0],tf=r.tarif||hargaUntuk(g,mp,m.kelas).tarif;await put('kelas',{id:nk,nama:`${mp} Private — ${m.nama}`,tipe:'Private',guruId:myId(),mapel:mp,hari:[],jam:'',lokasi:'',harga:tf*8,kapasitas:1,murid:[m.id]})}
 await put('req',{...r,status:'Diterima'});await notify(r.ortuId,`${N(G(myId()))} menerima pengajuan les ${N(m)}. 🎉`);toast((r.tipe==='Private'?'Diterima — atur jadwal & SPP di menu Kelas':'Diterima, murid masuk kelas')+(FEE()&&FEEMODE()==='sekali'?` · biaya platform ${rp(FEE())}`:''));render()}

let fM={kota:null,sort:'jarak',online:false};
function g_carimurid(){
 const g=G(myId());
 if(fM.owner!==myId())Object.assign(fM,nearbyFilters(g),{owner:myId()});
 const gl=nearbyCenter(fM,g),rad=g.radius||5,onl=/Online/.test(g.mode||''),off=/Offline/.test(g.mode||'');
 const subjects=(g.mapel||[]).filter(Boolean).map(name=>name.toLowerCase());
 const cocok=w=>{const subject=String(w.mapel||'').toLowerCase();return !!subject&&subjects.some(name=>subject.includes(name)||name.includes(subject))};
 const openPosts=S.lowongan.filter(w=>w.status==='Buka');
 let list=openPosts.filter(w=>nearbyMatch(fM,w,studentAreaPoint(w),onl&&fM.online));
 const D=w=>dist(gl,studentAreaPoint(w));
 list.sort((a,b)=>fM.sort==='baru'?b.tanggal.localeCompare(a.tanggal):(cocok(b)-cocok(a))||((D(a)??1e9)-(D(b)??1e9)));
 const points=list.map(w=>({point:studentAreaPoint(w),label:w.mapel+' · '+lokStr(w),action:()=>$('lw_'+w.id)?.scrollIntoView({behavior:'smooth'})}));
 return`<h2>Cari Murid</h2><p class="sub">Lihat kebutuhan les yang masih terbuka di daerah pilihanmu.</p>
 ${nearbyPanel('murid',fM,g,points,openPosts)}
 <div class="card"><label for="nearby-sort">Urutkan hasil</label><select id="nearby-sort" onchange="fM.sort=this.value;render()">${opt([['jarak','Terdekat & cocok'],['baru','Terbaru']],fM.sort)}</select>${onl&&fM.kota?`<label class="att"><input type="checkbox" ${fM.online?'checked':''} onchange="fM.online=this.checked;render()"> Tampilkan juga kebutuhan online dari kota lain</label>`:''}</div>
 ${list.map(w=>{const m=M(w.muridId),pel=S.lamaran.filter(l=>l.lowonganId===w.id),applied=pel.some(l=>l.guruId===myId()),d=D(w),inR=/Online/.test(w.mode||'')&&onl||(d!=null&&d<=rad&&off);
  return`<div class="card" id="lw_${w.id}"><div class="row between"><div><b style="font-size:16px">${esc(w.mapel)}</b> <span class="tag gr">${w.jenjang}</span><span class="tag warn">${esc(w.mode)}</span>${cocok(w)?'<span class="tag ok">Cocok dengan mapelmu</span>':''}${d!=null?(inR?'<span class="tag ok">✓ Dalam jangkauanmu</span>':'<span class="tag gr">Di luar jangkauan</span>'):''}
  <div class="mut">👦 ${esc(N(m))} (${esc(m?.kelas||'')}) · dipasang ${fdate(w.tanggal)}</div><div class="mut">📍 ${d!=null?`<b style="color:var(--or)">${fmtKm(d)}</b> · `:''}${esc(lokStr(w))} ${studentAreaPoint(w)?`· <a href="${gmaps(studentAreaPoint(w))}" target="_blank" rel="noopener noreferrer">Area di Maps</a>`:''}</div></div><div style="text-align:right"><b class="price">${rp(w.budget)}</b><div class="mut">/bulan</div></div></div><p>${esc(w.catatan)}</p><div class="row between"><small class="mut">${pel.length} guru sudah melamar</small>${applied?'<span class="tag ok">✔ Sudah melamar</span>':`<button class="btn sm or" onclick="lamar('${w.id}')">Lamar</button>`}</div></div>`}).join('')||`<div class="card empty">Belum ada kebutuhan les ${fM.kota?'di '+esc(fM.kota):''}. ${fM.kota?`<button class="btn sm sec" onclick="changeNearby('murid','kota','')">Lihat semua kota</button>`:''}</div>`}`;
}

function formKelas(id){const k=id?K(id):{nama:'',tipe:'Umum',mapel:(G(myId()).mapel||[''])[0],hari:[],jam:'16:00',lokasi:'',harga:'',kapasitas:8};

function formPR(){const ks=myKelas().filter(k=>(k.murid||[]).length);if(!ks.length)return toast('Belum ada kelas yang punya murid');const d=new Date();d.setDate(d.getDate()+3);

function g_spp(){

async function tolakBayar(id){const s=S.spp.find(x=>x.id===id);await put('spp',{...s,status:'Belum',bayar:'',metode:''});await notify(M(s.muridId)?.ortuId,`Pembayaran SPP ${N(M(s.muridId))} (${fdate(s.bulan)}) belum diterima guru. Mohon dicek kembali.`);toast('Status dikembalikan ke Belum');render()}

const KLS=['TK/PAUD','SD (semua kelas)','SD Kelas 1–3','SD Kelas 4–6','SD Kelas 1','SD Kelas 2','SD Kelas 3','SD Kelas 4','SD Kelas 5','SD Kelas 6','SMP (semua kelas)','SMP Kelas 7','SMP Kelas 8','SMP Kelas 9','SMA (semua kelas)','SMA Kelas 10','SMA Kelas 11','SMA Kelas 12','Persiapan UTBK/SNBT','Umum/Dewasa'];

function tarifRows(g){if(g.tarifList&&g.tarifList.length)return g.tarifList;const J={TK:'TK/PAUD',SD:'SD (semua kelas)',SMP:'SMP (semua kelas)',SMA:'SMA (semua kelas)'};return(g.mapel||[]).flatMap(m=>(g.jenjang||['SD']).map(j=>({mapel:m,kelas:J[j]||j,tarif:g.tarif||0})))}

 S.pr.forEach(p=>P(p.dibuat,'pr',`${N(G(K(p.kelasId)?.guruId))} memberi PR "${p.judul}" (${(p.murid||[]).length} murid)`));
 S.kumpul.forEach(k=>{const p=S.pr.find(x=>x.id===k.prId);P(k.tanggal,'pr',`${N(M(k.muridId))} mengumpulkan PR "${p?.judul||''}"${k.status==='Dinilai'?' — dinilai '+k.nilai:''}`)});

 <div class="row" style="margin-top:10px"><span class="mut" style="font-size:12px">Cek keaslian:</span><a class="btn sm gh" href="https://pddikti.kemdiktisaintek.go.id" target="_blank" rel="noopener">🔎 PDDikti (cari nama)</a><a class="btn sm gh" href="https://pisn.kemdiktisaintek.go.id/" target="_blank" rel="noopener">🔎 PISN (cek No. Ijazah)</a><button class="btn sm gh" onclick='copyTxt(${JSON.stringify(g.nama)})'>Salin nama</button><div class="sp"></div>${g.verif?'':`<button class="btn sm bad" onclick="tolakVerif('${g.id}')">✖ Minta perbaikan</button>`}<button class="btn sm ${g.verif?'gh':'ok'}" onclick="verif('${g.id}')">${g.verif?'Cabut verifikasi':'✔ Verifikasi guru ini'}</button></div>
 <p class="mut" style="font-size:11px;margin:8px 0 0">PDDikti untuk lulusan perguruan tinggi. Untuk ijazah SMA/sederajat, cocokkan foto ijazah dengan nama & No. ijazah.</p></div>`}
function tolakVerif(id){openM(`<h3>Minta perbaikan data</h3><p class="mut">${esc(namaG(G(id)))}</p><label>Alasan (akan dikirim ke guru)</label><textarea id="tv_a" placeholder="cth: Foto ijazah buram / No. ijazah tidak sesuai dengan foto"></textarea><div class="row" style="margin-top:14px"><button class="btn bad" onclick="kirimTolak('${id}')">Kirim</button><button class="btn gh" onclick="closeM()">Batal</button></div>`)}
async function kirimTolak(id){const a=$('tv_a').value.trim();if(!a)return toast('Isi alasan');const g=G(id);closeM();await put('guru',{...g,verif:false,verifStatus:'Ditolak',verifAlasan:a});await notify(id,`✖ Verifikasi akun perlu perbaikan: ${a}. Perbaiki di menu Profil.`);toast('Permintaan perbaikan dikirim');render()}
async function verif(id){const g=G(id);await put('guru',{...g,verif:!g.verif,verifStatus:g.verif?'Menunggu':'Terverifikasi',verifAlasan:''});if(!g.verif)await notify(id,'Selamat! Akun guru Anda sudah terverifikasi ✔');render()}
async function hapusAkun(c,id){if(!confirmTwice('ha'+id,'Klik Hapus sekali lagi untuk menghapus akun ini'))return;await del(c,id);toast('Dihapus');render()}
function a_cabang(){const k=c=>c.wilayah||[];const noCab=S.guru.filter(g=>!cabangOf(kotaOf(g))).length+S.ortu.filter(o=>!cabangOf(kotaOf(o))).length;
 return`<div class="row between"><div><h2>Cabang per Kota</h2><p class="sub">Guru & murid otomatis masuk cabang sesuai kota lokasinya.</p></div><button class="btn or" onclick="formCabang()">+ Tambah Cabang</button></div>
 ${noCab?`<div class="card" style="background:var(--warnb)"><b>⚠️ ${noCab} akun belum masuk cabang mana pun</b> — kotanya belum dicakup cabang. Tambahkan kota tersebut ke wilayah cabang, atau buat cabang baru.<div class="mut">${[...new Set([...S.guru,...S.ortu].filter(x=>!cabangOf(kotaOf(x))).map(x=>kotaOf(x)||'(belum isi lokasi)'))].map(esc).join(', ')}</div></div>`:''}
 <div class="grid g2">${S.cabang.map(c=>{const gs=S.guru.filter(g=>k(c).includes(kotaOf(g))),os=S.ortu.filter(o=>k(c).includes(kotaOf(o))),ms=S.murid.filter(m=>os.some(o=>o.id===m.ortuId)),ks=S.kelas.filter(kl=>gs.some(g=>g.id===kl.guruId)),spp=S.spp.filter(x=>x.bulan===BLN&&ks.some(kl=>kl.id===x.kelasId)),lw=S.lowongan.filter(w=>w.status==='Buka'&&k(c).includes(kotaOf(w)));
  return`<div class="card gcard"><div class="row between"><div><h3 style="margin:0">🏢 ${esc(c.nama)}</h3><div class="mut">${esc(c.alamat||'')}${c.hp?' · '+esc(c.hp):''}${c.kepala?' · Kepala: '+esc(c.kepala):''}</div></div><div class="row"><button class="btn sm gh" onclick="formCabang('${c.id}')">Edit</button></div></div>
  <div style="margin:8px 0">${k(c).map(x=>`<span class="tag gr">📍 ${esc(x)}</span>`).join('')}</div>
  <div class="grid" style="gap:8px;grid-template-columns:repeat(4,1fr)"><div class="stat" style="box-shadow:none;background:#f6f8fc;padding:10px"><small>Guru</small><b>${gs.length}</b></div><div class="stat" style="box-shadow:none;background:#f6f8fc;padding:10px"><small>Murid</small><b>${ms.length}</b></div><div class="stat" style="box-shadow:none;background:#f6f8fc;padding:10px"><small>Kelas</small><b>${ks.length}</b></div><div class="stat" style="box-shadow:none;background:#f6f8fc;padding:10px"><small>Cari guru</small><b>${lw.length}</b></div></div>
  <div class="row between" style="margin-top:10px"><span class="mut">SPP ${fdate(BLN)}: <b style="color:var(--ok)">${rp(spp.filter(x=>x.status==='Lunas').reduce((a,b)=>a+b.nominal,0))}</b> lunas · <b style="color:var(--bad)">${rp(spp.filter(x=>x.status!=='Lunas').reduce((a,b)=>a+b.nominal,0))}</b> belum</span><a style="color:var(--pri);font-weight:700;cursor:pointer" onclick="aCab='${c.id}';go('guru')">Lihat guru ›</a></div></div>`}).join('')||'<div class="card empty">Belum ada cabang. Tambahkan cabang pertamamu.</div>'}</div>`}
function formCabang(id){const c=id?S.cabang.find(x=>x.id===id):{nama:'LesGo! ',wilayah:[],alamat:'',hp:'',kepala:''};
 openM(`<h3>${id?'Edit':'Tambah'} Cabang</h3><label>Nama cabang</label><input id="cb_n" value="${esc(c.nama)}" placeholder="cth: LesGo! Tangerang"><label>Wilayah (kota yang dilayani)</label><div class="att" style="max-height:200px;overflow:auto">${KOTA_LIST.map(k=>{const other=S.cabang.find(x=>x.id!==id&&(x.wilayah||[]).includes(k));return`<label style="${other?'opacity:.5':''}" title="${other?'Sudah di '+esc(other.nama):''}"><input type="checkbox" class="cb_w" value="${esc(k)}" ${(c.wilayah||[]).includes(k)?'checked':''} ${other?'disabled':''}>${esc(k)}</label>`}).join('')}</div>
 <label>Alamat kantor / tempat belajar</label><input id="cb_a" value="${esc(c.alamat)}"><div class="split"><div><label>No. HP cabang</label><input id="cb_h" value="${esc(c.hp)}"></div><div><label>Kepala cabang</label><input id="cb_k" value="${esc(c.kepala)}"></div></div>
 <div class="row" style="margin-top:16px"><button class="btn or" onclick="simpanCabang('${id||''}')">Simpan</button><button class="btn gh" onclick="closeM()">Batal</button>${id?`<div class="sp"></div><button class="btn sm bad" onclick="hapusCabang('${id}')">Hapus</button>`:''}</div>`)}
async function simpanCabang(id){const d={nama:$('cb_n').value.trim(),wilayah:[...document.querySelectorAll('.cb_w:checked')].map(x=>x.value),alamat:$('cb_a').value,hp:$('cb_h').value,kepala:$('cb_k').value};if(!d.nama)return toast('Isi nama cabang');if(!d.wilayah.length)return toast('Pilih minimal 1 kota');
 closeM();await put('cabang',id?{...S.cabang.find(x=>x.id===id),...d}:{id:uid('c'),...d});toast('Cabang disimpan');render()}
async function hapusCabang(id){if(!confirmTwice('hc'+id,'Klik Hapus sekali lagi untuk menghapus cabang'))return;closeM();await del('cabang',id);render()}
function a_ortu(){return`<h2>Orang Tua & Murid</h2><p class="sub">Semua keluarga yang terdaftar.</p><div class="card">${tw(`<table><tr><th>Akun</th><th>Kontak</th><th>Murid</th><th></th></tr>${S.ortu.map(o=>`<tr><td><b>${esc(o.nama)}</b> <span class="tag ${o.tipe==='murid'?'warn':'gr'}">${o.tipe==='murid'?'Murid (daftar sendiri)':'Orang tua'}</span><div class="mut">📍 ${esc(lokStr(o))}</div>${cabTag(o)}</td><td>${esc(o.hp)}</td><td>${S.murid.filter(m=>m.ortuId===o.id).map(m=>`${esc(m.nama)} <span class="mut">(${esc(m.kelas)})</span>`).join('<br>')||'-'}</td><td><div class="row">${o.nonaktif?'<span class="tag bad">Nonaktif</span>':''}<button class="btn sm ${o.nonaktif?'ok':'gh'}" onclick="toggleAktif('ortu','${o.id}')">${o.nonaktif?'Aktifkan':'Nonaktifkan'}</button><button class="btn sm gh" onclick="resetPin('ortu','${o.id}')">Reset PIN</button><button class="btn sm gh" onclick="hapusAkun('ortu','${o.id}')">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan=4 class="empty">Belum ada</td></tr>'}</table>`)}</div>`}
function a_spp(){const l=[...S.spp].sort((a,b)=>b.bulan.localeCompare(a.bulan));return`<h2>Semua SPP</h2><p class="sub">Rekap pembayaran seluruh kelas.</p>${verifyTransferPanel()}${MODE==='api'?'<div class="row discovery-pages"><button type="button" class="btn gh" onclick="inspectTeacherBank()">Lihat rekening guru</button></div>':''}<div class="card">${tw(`<table><tr><th>Bulan</th><th>Murid</th><th>Kelas</th><th>Guru</th><th>Nominal</th><th>Status</th></tr>${l.map(s=>`<tr><td>${fdate(s.bulan)}</td><td>${esc(N(M(s.muridId)))}</td><td>${esc(K(s.kelasId)?.nama||'')}</td><td>${esc(N(G(K(s.kelasId)?.guruId)))}</td><td>${rp(s.nominal)}</td><td>${stTag(s.status)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">Belum ada</td></tr>'}</table>`)}</div>`}
function a_kelas(){return`<h2>Semua Kelas</h2><p class="sub">Private & Umum dari semua guru.</p><div class="card">${tw(`<table><tr><th>Kelas</th><th>Jenis</th><th>Guru</th><th>Jadwal</th><th>Murid</th><th>SPP</th></tr>${S.kelas.map(k=>`<tr><td><b>${esc(k.nama)}</b></td><td>${tipeTag(k.tipe)}</td><td>${esc(N(G(k.guruId)))}</td><td>${esc(fmtJadwal(k))}</td><td>${(k.murid||[]).map(m=>esc(N(M(m)))).join(', ')} <span class="mut">(${(k.jumlahMurid??(k.murid||[]).length)}/${k.kapasitas})</span></td><td>${rp(k.harga)}</td></tr>`).join('')||'<tr><td colspan=6 class="empty">Belum ada</td></tr>'}</table>`)}</div>`}
function a_pengaturan(){const c=CFG();const demo=COLS.reduce((a,col)=>a+S[col].filter(x=>x.demo).length,0);
 return`<h2>Pengaturan</h2><p class="sub">Identitas lembaga dan pengelolaan data.</p><div class="grid g2"><div class="card"><h3>Identitas lembaga</h3><p class="mut" style="font-size:12px">Nama ini tampil di samping logo LesGo! (misalnya nama cabang).</p><label>Nama cabang / lembaga</label><input id="cf_n" value="${esc(c.nama||'')}" placeholder="opsional — cth: LesGo! Cabang Tebet"><label>Info pembayaran default (jika guru belum mengisi rekening)</label><textarea id="cf_b">${esc(c.infoBayar||'')}</textarea><button class="btn" style="margin-top:12px" onclick="simpanCfg()">Simpan</button></div>
 <div class="card"><h3>Data contoh</h3><p class="mut">Ada <b>${demo}</b> data contoh (guru, orang tua, kelas, dll.) untuk mencoba sistem. Hapus sebelum mulai dipakai sungguhan.</p><button class="btn bad" ${demo?'':'disabled'} onclick="hapusDemo()">Hapus semua data contoh</button>
 <h3 style="margin-top:18px">Cara mengajak guru & orang tua</h3><p class="mut">Bagikan tautan <a href="https://lesgo-mu.vercel.app/" target="_blank" rel="noopener">lesgo-mu.vercel.app</a>. Guru memilih Daftar Jadi Guru Les; murid atau orang tua memilih Saya Mau Les. Masing-masing masuk dengan nomor WhatsApp dan PIN sendiri. Akses admin hanya untuk pemilik.</p></div></div>`}
async function simpanCfg(){await put('config',{...CFG(),id:'main',nama:$('cf_n').value.trim(),infoBayar:$('cf_b').value});toast('Pengaturan disimpan');render()}
async function hapusDemo(){if(!confirmTwice('demo','Klik sekali lagi untuk menghapus SEMUA data contoh'))return;toast('Menghapus data contoh…');for(const c of COLS)for(const x of S[c].filter(x=>x.demo))await del(c,x.id);toast('Data contoh dihapus');render()}
init();
if(location.protocol!=='file:')void loadSupportPhone();
</script>
</body>
